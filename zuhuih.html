<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./z-lol.css">
    <title>Document</title>
</head>
<body>
<div id="music-widget" class="floating-music">
  <audio id="bg-music" loop>
    <source src="music1.mp3" type="audio/mpeg">
  </audio>

  <div class="music-icon" id="music-toggle">
    <span class="note-icon">♪</span>
  </div>

  <div class="music-menu" id="music-menu">
    <div class="menu-header">背景音樂</div>
    <div class="song-option active" data-src="music1.mp3">聖誕嘉年華</div>
    <div class="song-option" data-src="music2.mp3">寧靜雪地</div>
    <div class="song-option" data-src="music3.mp3">平安夜鈴聲</div>
  </div>
</div>

<script src="./z-lol.js"></script>
</body>
</html>
